<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Rivo</title>
<style>
  html,body{margin:0;height:100%;background:#141A33;color:#A5B4FC;font:600 14px system-ui,'Segoe UI',sans-serif}
  body{display:grid;place-items:center}
  .b{display:flex;flex-direction:column;align-items:center;gap:16px}
  .orbit{transform-box:view-box;transform-origin:30px 36px;animation:orbit 2.4s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.orbit{animation:none}}
  #e{max-width:420px;text-align:center;color:#FF8A90;display:none;font-weight:500}
</style>
</head>
<body>
<div class="b">
  <!-- Rivo loading mark: the spark orbits the ring -->
  <svg viewBox="0 0 64 64" width="72" height="72" role="img" aria-label="Загрузка"><circle cx="30" cy="36" r="16" fill="none" stroke="#A5B4FC" stroke-width="9"/><g class="orbit"><rect x="44" y="6" width="12" height="12" rx="2" fill="#8EDCC8" transform="rotate(45 50 12)"/></g></svg>
  <div>Запускаем медиасервер…</div>
  <div id="e"></div>
</div>
<script>
  // The shell navigates this window to the local server once it is ready.
  window.addEventListener('hc-error', (e) => { const el = document.getElementById('e'); el.textContent = e.detail; el.style.display = 'block'; });
</script>
</body>
</html>
