name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build
      - name: Go vet and tests
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          GOOS=windows go build -o /dev/null ./cmd/homecinema

  windows:
    needs: test
    runs-on: windows-latest
    env:
      TRIPLE: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build media server
        working-directory: server
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.1.0-${GITHUB_SHA::7}"
          mkdir -p ../desktop/src-tauri/binaries
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../desktop/src-tauri/binaries/homecinema-server-$TRIPLE.exe ./cmd/homecinema

      - name: Fetch FFmpeg (LGPL build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN renames assets on each FFmpeg release, so pick the newest
          # stable LGPL win64 build from the current list instead of a fixed URL.
          NAME=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
            | grep -E '^ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip$' | sort -V | tail -1)
          [ -n "$NAME" ] || { echo "no LGPL win64 build found"; exit 1; }
          echo "Using $NAME"
          gh release download latest -R BtbN/FFmpeg-Builds -p "$NAME" -O ffmpeg.zip
          7z x ffmpeg.zip -offmpeg >/dev/null
          BIN=$(dirname "$(find ffmpeg -name ffmpeg.exe | head -1)")
          cp "$BIN/ffmpeg.exe" desktop/src-tauri/binaries/ffmpeg-$TRIPLE.exe
          cp "$BIN/ffprobe.exe" desktop/src-tauri/binaries/ffprobe-$TRIPLE.exe
          cp "$(dirname "$BIN")/LICENSE.txt" desktop/src-tauri/FFMPEG-LICENSE.txt || true

      - name: Build installer
        working-directory: desktop
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: HomeCinema-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
